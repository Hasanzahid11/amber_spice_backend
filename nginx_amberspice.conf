server {
    server_name spiceadmin.innovationark.co 153.79.249.25 _;

    client_max_body_size 50M;

    # Static files
    location /static/ {
        alias /var/www/amber_spice_backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media files
    location /media/ {
        alias /var/www/amber_spice_backend/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Root redirect to API documentation
    location = / {
        return 302 /api/docs/;
    }

    # WebSocket Daphne ASGI proxy
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Django backend Gunicorn proxy
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/spiceadmin.innovationark.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/spiceadmin.innovationark.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = spiceadmin.innovationark.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name spiceadmin.innovationark.co 153.79.249.25 _;
    return 404; # managed by Certbot
}
